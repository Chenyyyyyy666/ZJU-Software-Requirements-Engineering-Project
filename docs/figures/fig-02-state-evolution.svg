   </g>
   <g id="text_13">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #526579" transform="translate(438.1056 340.063157)">Hi Melanie! Hope you're doing good. Guess</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #526579" transform="translate(438.1056 353.698157)">what I did this week? I took the first step</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #526579" transform="translate(438.1056 367.333157)">towards becoming a mom - I applied to</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #526579" transform="translate(438.1056 380.968157)">adoption agencies! It's a big decision, …</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526579" x="438.1056" y="416.709034" transform="rotate(-0 438.1056 416.709034)">Memory ID: m_3bfa6e1817e405c8…</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2c647e" x="810.2016" y="156.627881" transform="rotate(-0 810.2016 156.627881)">3  |  2023-10-22</text>
   </g>
   <g id="text_16">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #182d43" transform="translate(810.2016 191.590685)">Caroline passed the adoption agency</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #182d43" transform="translate(810.2016 211.890685)">interviews last Friday.</text>
   </g>
   <g id="text_17">
