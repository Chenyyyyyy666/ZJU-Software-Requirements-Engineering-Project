    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182d43" x="810.2016" y="315.587681" transform="rotate(-0 810.2016 315.587681)">Original source: D19:1</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #526579" transform="translate(810.2016 340.063157)">Woohoo Melanie! I passed the adoption</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #526579" transform="translate(810.2016 353.698157)">agency interviews last Friday! I'm so</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #526579" transform="translate(810.2016 367.333157)">excited and thankful. This is a big move</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #526579" transform="translate(810.2016 380.968157)">towards my goal of having a family.</text>
   </g>
