   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2c647e" x="66.0096" y="156.627881" transform="rotate(-0 66.0096 156.627881)">1  |  2023-05-25</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #182d43" transform="translate(66.0096 191.590685)">Caroline is researching adoption</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #182d43" transform="translate(66.0096 211.890685)">agencies.</text>
   </g>
   <g id="text_5">
