   </g>
   <g id="text_7">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #526579" transform="translate(66.0096 340.063157)">Researching adoption agencies — it's been a</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #526579" transform="translate(66.0096 353.698157)">dream to have a family and give a loving</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #526579" transform="translate(66.0096 368.311594)">home to kids who need it.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526579" x="66.0096" y="416.709034" transform="rotate(-0 66.0096 416.709034)">Memory ID: m_5e5e0af5adefa105…</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2c647e" x="438.1056" y="156.627881" transform="rotate(-0 438.1056 156.627881)">2  |  2023-08-23</text>
   </g>
   <g id="text_10">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #182d43" transform="translate(438.1056 191.590685)">Caroline applied to adoption</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #182d43" transform="translate(438.1056 211.890685)">agencies this week.</text>
   </g>
